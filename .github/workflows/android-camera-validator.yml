name: Build Cam Validator APK
on:
  push:
    paths: ['android-camera-validator/**', '.github/workflows/android-camera-validator.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-camera-validator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CamValidator-debug-apk
          path: android-camera-validator/app/build/outputs/apk/debug/app-debug.apk
